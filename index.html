<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',

  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    *{font-family:'Inter',-apple-system,BlinkMacSystont,'PingFang SC','Microsoft YaHei',sans-serif}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .animate-fadeInUp{animation:fadeInUp .4s ease-out forwards}
    .stagger-1{animation-delay:.05s;opacity:0}.stagger-2{animation-delay:.1s;opacity:0}.stagger-3{animation-delay:.15s;opacity:0}.stagger-4{animation-delay:.2s;opacity:0}
    .glass{background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.6)}
    .dark .glass{background:rgba(30,32,38,.85);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.06)}
    .metric-ring{transform:rotate(-90deg)}
    ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:3px}
    .dark ::-webkit-scrollbar-thumb{background:#374151}
    .modal-overlay{background:rgba(0,0,0,.3);backdrop-filter:blur(4px)}
    .dark .modal-overlay{background:rgba(0,0,0,.55)}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    .spin{animation:spin 1s linear infinite}
    .sync-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px}
    .sync-dot.ok{background:#10b981}.sync-dot.err{background:#ef4444}.sync-dot.loading{background:#f59e0b}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .animate-float{animation:float 3s ease-in-out infinite}
    @keyframes pulse-soft{0%,100%{opacity:.6}50%{opacity:1}}
    .animate-pulse-soft{animation:pulse-soft 2s ease-in-out infinite}
    @keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
    .animate-scaleIn{animation:scaleIn .25s ease-out forwards}
    @keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .animate-slideUp{animation:slideUp .3s ease-out forwards}
    /* Page transition */
    @keyframes pageEnter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .page-enter{animation:pageEnter .35s ease-out}
    /* Dark mode transitions */
    body,div,span,button,a,input,textarea,select{transition:background-color .3s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease}
    /* FAB */
    @keyframes fabPop{from{opacity:0;transform:scale(0) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
    .fab-item{animation:fabPop .2s ease-out forwards;opacity:0}
    .fab-item:nth-child(1){animation-delay:.02s}
    .fab-item:nth-child(2){animation-delay:.06s}
    .fab-item:nth-child(3){animation-delay:.1s}
    .fab-item:nth-child(4){animation-delay:.14s}
    /* Dark mode specific overrides */
    .dark .dark\:glass-dark{background:rgba(30,32,38,.85);border-color:rgba(255,255,255,.06)}
  </style>
</head>
<body class="bg-[#f4f6f9] dark:bg-[#111318]">
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useCallback,useRef,createContext,useContext}=React;

// ========== Dark Mode Context ==========
const ThemeContext=createContext();
function ThemeProvider({children}){
  const[dark,setDark]=useState(()=>{
    const saved=localStorage.getItem('gzt_theme');
    if(saved)return saved==='dark';
    return window.matchMedia('(prefers-color-scheme:dark)').matches;
  });
  useEffect(()=>{
    document.documentElement.classList.toggle('dark',dark);
    localStorage.setItem('gzt_theme',dark?'dark':'light');
  },[dark]);
  return <ThemeContext.Provider value={{dark,setDark,toggle:()=>setDark(d=>!d)}}>{children}</ThemeContext.Provider>;
}
function useTheme(){return useContext(ThemeContext)}

// ========== Cloud Store (GitHub Gist) ==========
const GIST_ID='aa6baa010efb971735f949e6d7bcf619';
const GIST_API=`https://api.github.com/gists/${GIST_ID}`;
const DATA_FILE='gzt_data.json';

const DataContext=createContext();

function DataProvider({children}){
  const[data,setData]=useState(null);
  const[loading,setLoading]=useState(true);
  const[syncStatus,setSyncStatus]=useState('loading');
  const[isAdmin,setIsAdmin]=useState(!!localStorage.getItem('gzt_admin_token'));
  const saveTimer=useRef(null);
  const dataRef=useRef(null);

  useEffect(()=>{loadFromCloud()},[]);

  const loadFromCloud=async()=>{
    setSyncStatus('loading');
    try{
      const rawUrl=`https://gist.githubusercontent.com/Xixixi-coder/${GIST_ID}/raw/${DATA_FILE}?t=${Date.now()}`;
      let res=await fetch(rawUrl,{cache:'no-store'});
      if(!res.ok){
        res=await fetch(GIST_API,{headers:{'Accept':'application/vnd.github.v3+json'},cache:'no-store'});
        if(!res.ok)throw new Error('Gist fetch failed: '+res.status);
        const gist=await res.json();
        var content=JSON.parse(gist.files[DATA_FILE].content);
      }else{
        var content=await res.json();
      }
      setData(content);dataRef.current=content;
      localStorage.setItem('gzt_cloud_cache',JSON.stringify(content));
      setSyncStatus('ok');
    }catch(e){
      console.warn('Cloud load failed, using cache:',e);
      try{
        const cached=JSON.parse(localStorage.getItem('gzt_cloud_cache'));
        if(cached){setData(cached);dataRef.current=cached;setSyncStatus('err')}
        else{const seed=getDefaultData();setData(seed);dataRef.current=seed;setSyncStatus('err')}
      }catch{const seed=getDefaultData();setData(seed);dataRef.current=seed;setSyncStatus('err')}
    }finally{setLoading(false)}
  };

  const getDefaultData=()=>({todos:[],github_skills:[],newsletter:[],metrics:[],schedules:[],polls:[]});

  const saveToCloud=useCallback((newData)=>{
    setData(newData);dataRef.current=newData;
    localStorage.setItem('gzt_cloud_cache',JSON.stringify(newData));
    const token=localStorage.getItem('gzt_admin_token');
    if(!token)return;
    if(saveTimer.current)clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(async()=>{
      setSyncStatus('saving');
      try{
        const res=await fetch(GIST_API,{
          method:'PATCH',
          headers:{'Authorization':`token ${token}`,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},
          body:JSON.stringify({files:{[DATA_FILE]:{content:JSON.stringify(newData,null,2)}}})
        });
        if(!res.ok){const err=await res.json().catch(()=>({}));throw new Error(err.message||'Save failed')}
        setSyncStatus('ok');
      }catch(e){console.error('Cloud save failed:',e);setSyncStatus('err')}
    },800);
  },[]);

  const updateKey=(key,val)=>{const newData={...dataRef.current,[key]:val};saveToCloud(newData)};
  const getKey=(key,def=[])=>{if(!dataRef.current)return def;return dataRef.current[key]||def};
  const setAdminToken=(token)=>{if(token){localStorage.setItem('gzt_admin_token',token);setIsAdmin(true)}else{localStorage.removeItem('gzt_admin_token');setIsAdmin(false)}};

  return(<DataContext.Provider value={{data,loading,syncStatus,isAdmin,setAdminToken,updateKey,getKey,loadFromCloud}}>
    {children}
  </DataContext.Provider>);
}

function useData(){return useContext(DataContext)}
let _id=()=>Date.now()+Math.random().toString(36).slice(2,6);

      <circle cx="16" cy="19" r="2" className="fill-blue-300 dark:fill-blue-600 animate-pulse-soft"/>
      <circle cx="22" cy="19" r="2" className="fill-blue-300 dark:fill-blue-600 animate-pulse-soft" style={{animationDelay:'.3s'}}/>

      <rect x="18" y="28" width="32" height="22" rx="8" className="fill-emerald-100 dark:fill-emerald-900/50 stroke-emerald-200 dark:stroke-emerald-800" strokeWidth="1"/>
      <rect x="24" y="36" width="20" height="3" rx="1.5" className="fill-emerald-200 dark:fill-emerald-700"/>
      <rect x="24" y="42" width="12" height="3" rx="1.5" className="fill-emerald-200 dark:fill-emerald-700"/>
    </svg>
    <p className="text-[12px] text-gray-400 dark:text-gray-500">暂无进行中的投票</p>

// ========== Modal ==========
function Modal({open,onClose,title,children}){
  if(!open)return null;
  return(<div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay" onClick={onClose}>
    <div className="bg-white dark:bg-[#1e2026] rounded-[20px] shadow-2xl w-[500px] max-h-[80vh] overflow-y-auto p-[28px] animate-scaleIn" onClick={e=>e.stopPropagation()}>
      <div className="flex justify-between items-center mb-[20px]">
        <h3 className="text-[18px] font-bold text-gray-900 dark:text-gray-100">{title}</h3>
        <button onClick={onClose} className="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"><i className="fas fa-times"></i></button>
      </div>{children}
    </div></div>);
}

// ========== DarkModeToggle ==========
function DarkModeToggle(){
  const{dark,toggle}=useTheme();
  return(<button onClick={toggle} className="w-[36px] h-[36px] rounded-[10px] flex items-center justify-center text-[14px] transition-all duration-300 hover:scale-105 active:scale-95 bg-gray-100 dark:bg-gray-800 text-amber-500 dark:text-blue-400 hover:bg-gray-200 dark:hover:bg-gray-700 shadow-sm" title={dark?'切换到浅色模式':'切换到深色模式'}>
    <i className={`fas ${dark?'fa-moon':'fa-sun'} transition-transform duration-300`} style={{transform:dark?'rotate(-15deg)':'rotate(0deg)'}}></i>
  </button>);
}

// ========== SyncBadge ==========
function SyncBadge(){
  const{syncStatus,isAdmin,loadFromCloud}=useData();
  const labels={ok:'已同步',err:'同步失败',loading:'加载中...',saving:'保存中...'};
  const dotClass={ok:'ok',err:'err',loading:'loading',saving:'loading'};
  return(<div className="flex items-center gap-[6px]">
    <button onClick={loadFromCloud} className="text-[10px] text-gray-400 hover:text-blue-500 dark:hover:text-blue-400" title="刷新数据"><i className={`fas fa-sync-alt ${syncStatus==='loading'||syncStatus==='saving'?'spin':''}`}></i></button>
    <span className={`sync-dot ${dotClass[syncStatus]}`}></span>
    <span className="text-[10px] text-gray-400 dark:text-gray-500">{labels[syncStatus]}</span>
    {isAdmin&&<span className="text-[10px] text-emerald-500 font-medium">管理员</span>}
  </div>);
}

// ========== AdminPanel ==========
function AdminPanel({open,onClose}){
  const{isAdmin,setAdminToken}=useData();
  const[token,setToken]=useState('');
  const handleSave=()=>{setAdminToken(token||null);onClose()};
  const handleLogout=()=>{setAdminToken(null);onClose()};
  return(<Modal open={open} onClose={onClose} title="管理员设置">
    <div className="flex flex-col gap-[14px]">
      <p className="text-[13px] text-gray-500 dark:text-gray-400 leading-relaxed">
        输入 GitHub Personal Access Token (需 gist 权限) 即可编辑共享数据。<br/>
        <span className="text-[11px] text-gray-400 dark:text-gray-500">普通访客可查看所有数据，但修改仅保存在本地。</span>
      </p>
      {isAdmin?(<div>
        <div className="p-[12px] bg-emerald-50 dark:bg-emerald-900/30 rounded-[10px] text-[13px] text-emerald-700 dark:text-emerald-400 mb-[12px]"><i className="fas fa-check-circle mr-[6px]"></i>当前已登录为管理员，数据修改会同步到云端</div>
        <button onClick={handleLogout} className="w-full py-[9px] bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-[10px] text-[13px] font-medium hover:bg-red-100 dark:hover:bg-red-900/50">退出管理员</button>
      </div>):(<div>
        <input type="password" value={token} onChange={e=>setToken(e.target.value)} className="w-full px-[12px] py-[9px] bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-[10px] text-[13px] text-gray-900 dark:text-gray-100 focus:outline-none focus:border-blue-300 font-mono" placeholder="***"/>
        <button onClick={handleSave} className="mt-[10px] w-full py-[9px] bg-gray-900 dark:bg-blue-600 text-white rounded-[10px] text-[13px] font-medium hover:bg-gray-800 dark:hover:bg-blue-700">保存 Token</button>
      </div>)}
    </div>
  </Modal>);
}

// ========== Sidebar ==========
function Sidebar({currentPage,onNavigate}){
  const[collapsed,setCollapsed]=useState(false);
  const[showAdmin,setShowAdmin]=useState(false);
  const{isAdmin}=useData();
  const navGroups={'核心看板':[{key:'index',icon:'fa-home',label:'数据概览'}],'资讯与协作':[{key:'aiInfo',icon:'fa-sparkles',label:'前沿视界'},{key:'orgActivity',icon:'fa-users',label:'组织事务'}]};
  return(<>
    <div className={`${collapsed?'w-[72px]':'w-[250px]'} bg-white dark:bg-[#16181d] min-h-screen flex flex-col border-r border-gray-100 dark:border-gray-800 shadow-[2px_0_8px_rgba(0,0,0,0.02)] dark:shadow-[2px_0_8px_rgba(0,0,0,0.2)] transition-all duration-300 relative z-10`}>
      <div className={`p-[20px] ${collapsed?'px-[14px]':''} flex items-center gap-[10px] mb-[8px]`}>
        <div className="w-[34px] h-[34px] bg-gradient-to-br from-gray-800 to-gray-900 dark:from-blue-600 dark:to-indigo-700 rounded-[10px] flex items-center justify-center shadow flex-shrink-0"><i className="fas fa-layer-group text-white text-[13px]"></i></div>
        {!collapsed&&<span className="font-bold text-[16px] text-gray-900 dark:text-gray-100 tracking-tight whitespace-nowrap">应用产品部工作台</span>}
      </div>
      <div className="flex-1 px-[10px] flex flex-col gap-[2px]">
        {Object.entries(navGroups).map(([g,items],gi)=>(
          <div key={g} className={gi>0?'mt-[12px]':''}>
            {!collapsed&&<div className="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider px-[10px] mb-[6px]">{g}</div>}
            {items.map(item=>(
              <button key={item.key} onClick={()=>onNavigate(item.key)}
                className={`w-full flex items-center gap-[10px] text-left px-[12px] py-[10px] rounded-[10px] text-[13px] font-medium transition-all duration-200 mb-[1px] ${currentPage===item.key?'bg-gradient-to-r from-gray-900 to-gray-800 dark:from-blue-600 dark:to-indigo-600 text-white shadow-md':'text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-gray-200'}`}>
                <i className={`fas ${item.icon} w-[16px] text-center text-[12px] ${currentPage===item.key?'text-white':'text-gray-400 dark:text-gray-500'}`}></i>
                {!collapsed&&item.label}
              </button>
            ))}
          </div>
        ))}
      </div>
      {!collapsed&&<div className="px-[14px] py-[8px]"><SyncBadge/></div>}
      <button onClick={()=>setCollapsed(!collapsed)} className="absolute top-[50%] -right-[12px] w-[22px] h-[22px] bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-full flex items-center justify-center shadow-sm hover:shadow text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 text-[9px]">
        <i className={`fas ${collapsed?'fa-chevron-right':'fa-chevron-left'}`}></i>
      </button>
      <div className={`p-[14px] ${collapsed?'px-[10px]':'px-[16px]'} border-t border-gray-100 dark:border-gray-800`}>
        <div className="flex items-center gap-[8px]">
          <div className="w-[30px] h-[30px] rounded-full bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center text-white text-[11px] font-bold flex-shrink-0">我</div>
          {!collapsed&&<div className="flex-1 flex items-center justify-between">
            <div className="text-[12px] font-medium text-gray-700 dark:text-gray-300 truncate">应用产品部</div>
            <div className="flex items-center gap-[4px]">
              <DarkModeToggle/>
              <button onClick={()=>setShowAdmin(true)} className={`w-[24px] h-[24px] rounded-[6px] flex items-center justify-center text-[11px] transition-colors ${isAdmin?'text-emerald-500 hover:bg-emerald-50 dark:hover:bg-emerald-900/30':'text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800'}`} title="管理员设置"><i className={`fas ${isAdmin?'fa-lock-open':'fa-lock'}`}></i></button>
            </div>
          </div>}
        </div>
      </div>
    </div>
    <AdminPanel open={showAdmin} onClose={()=>setShowAdmin(false)}/>
  </>);
}

// ========== WelcomeHeader ==========
function WelcomeHeader(){
  const[time,setTime]=useState(new Date());
  useEffect(()=>{const t=setInterval(()=>setTime(new Date()),60000);return()=>clearInterval(t)},[]);
  const h=time.getHours();
  const g=h<9?'早上好':h<12?'上午好':h<14?'中午好':h<18?'下午好':'晚上好';
  const d=time.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  return(<div className="flex justify-between items-center mb-[24px] animate-fadeInUp"><div><h1 className="text-[24px] font-bold text-gray-900 dark:text-gray-100 tracking-tight">{g}，欢迎回来 👋</h1><p className="text-[13px] text-gray-500 dark:text-gray-400 mt-[2px]">{d}</p></div></div>);
}

// ========== MetricRing ==========
function MetricRing({percent,color,size=44}){
  const r=(size-6)/2,c=2*Math.PI*r;
  return(<svg width={size} height={size} className="metric-ring"><circle cx={size/2} cy={size/2} r={r} fill="none" stroke="currentColor" strokeWidth="5" className="text-gray-100 dark:text-gray-700"/><circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="5" strokeDasharray={c} strokeDashoffset={c-(percent/100)*c} strokeLinecap="round" style={{transition:'stroke-dashoffset 1s ease-out'}}/></svg>);
}

// ========== QuarterGoals ==========
function QuarterGoals(){
  const{getKey,updateKey,isAdmin}=useData();
  const metrics=getKey('metrics',[]);
  const[showAdd,setShowAdd]=useState(false);
  const[form,setForm]=useState({label:'',value:'',change_text:'',positive:1,percent:0,color:'#3b82f6',icon:'fa-chart-line',link:''});

// ========== TodoList ==========
function TodoList(){
  const{getKey,updateKey,isAdmin}=useData();
  const todos=getKey('todos',[]);
  const[newTodo,setNewTodo]=useState('');
  const save=t=>updateKey('todos',t);
  const add=()=>{if(!newTodo.trim())return;save([{id:_id(),title:newTodo,type:'待办',priority:'medium',date:'',status:'pending'},...todos]);setNewTodo('')};
  const toggle=id=>save(todos.map(t=>t.id===id?{...t,status:t.status==='done'?'pending':'done'}:t));
  const del=id=>save(todos.filter(t=>t.id!==id));
  const pc={high:'border-l-red-400',medium:'border-l-amber-400',low:'border-l-blue-300'};
  const pending=todos.filter(t=>t.status!=='done'),done=todos.filter(t=>t.status==='done');
  return(<div className="glass rounded-[18px] p-[24px] shadow-[0_4px_20px_rgba(0,0,0,0.03)] dark:shadow-[0_4px_20px_rgba(0,0,0,0.15)] h-full flex flex-col animate-fadeInUp stagger-2">
    <div className="flex justify-between items-center mb-[16px]"><div><h2 className="text-[17px] font-bold text-gray-900 dark:text-gray-100">待办与关注</h2><span className="text-[11px] text-gray-400 dark:text-gray-500">{pending.length} 项待处理</span></div><span className="text-[11px] text-gray-400 dark:text-gray-500 bg-gray-100 dark:bg-gray-800 px-[8px] py-[2px] rounded-full">{done.length}/{todos.length} 完成</span></div>
    {isAdmin&&<div className="flex gap-[8px] mb-[12px]"><input value={newTodo} onChange={e=>setNewTodo(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()} placeholder="添加新待办..." className="flex-1 px-[12px] py-[8px] bg-gray-50 dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-[10px] text-[13px] text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:border-blue-300 focus:bg-white dark:focus:bg-gray-700 transition-all"/><button onClick={add} className="px-[12px] py-[8px] bg-gray-900 dark:bg-blue-600 text-white rounded-[10px] text-[12px] font-medium hover:bg-gray-800 dark:hover:bg-blue-700"><i className="fas fa-plus"></i></button></div>}
    <div className="flex flex-col gap-[6px] flex-1 overflow-y-auto">
      {todos.sort((a,b)=>a.status==='done'?1:b.status==='done'?-1:0).map(t=>(<div key={t.id} className={`flex items-center justify-between p-[12px] rounded-[10px] border-l-[3px] ${pc[t.priority]||'border-l-gray-300'} bg-gray-50/60 dark:bg-gray-800/60 hover:bg-white dark:hover:bg-gray-700 hover:shadow-sm transition-all group ${t.status==='done'?'opacity-50':''}`}>
        <div className="flex items-center gap-[10px]">
          {isAdmin?<button onClick={()=>toggle(t.id)} className={`w-[18px] h-[18px] rounded-full border-2 flex items-center justify-center transition-all flex-shrink-0 ${t.status==='done'?'bg-emerald-500 border-emerald-500':'border-gray-300 dark:border-gray-600 hover:border-blue-400'}`}>{t.status==='done'&&<i className="fas fa-check text-white text-[8px]"></i>}</button>
          :<div className={`w-[18px] h-[18px] rounded-full border-2 flex items-center justify-center flex-shrink-0 ${t.status==='done'?'bg-emerald-500 border-emerald-500':'border-gray-300 dark:border-gray-600'}`}>{t.status==='done'&&<i className="fas fa-check text-white text-[8px]"></i>}</div>}
          <div><span className={`text-[13px] font-medium ${t.status==='done'?'text-gray-400 dark:text-gray-500 line-through':'text-gray-800 dark:text-gray-200'}`}>{t.title}</span>
            <div className="flex items-center gap-[6px] mt-[1px]"><span className={`text-[10px] font-medium px-[5px] py-[0.5px] rounded ${t.type==='待办'?'bg-orange-50 dark:bg-orange-900/30 text-orange-500 dark:text-orange-400':'bg-emerald-50 dark:bg-emerald-900/30 text-emerald-500 dark:text-emerald-400'}`}>{t.type}</span>{t.date&&<span className="text-[10px] text-gray-400 dark:text-gray-500">{t.date}</span>}</div>
          </div>
        </div>
        {isAdmin&&<button onClick={()=>del(t.id)} className="text-[11px] text-gray-300 dark:text-gray-600 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100"><i className="fas fa-trash"></i></button>}
      </div>))}
    </div>
  </div>);
}

// ========== FAB Quick Actions ==========
function FAB({onNavigate}){
  const[open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    const handler=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};
    document.addEventListener('mousedown',handler);
    return()=>document.removeEventListener('mousedown',handler);
  },[]);

  const actions=[
    {icon:'fa-plus',label:'添加待办',color:'blue',onClick:()=>{onNavigate('index');setOpen(false)}},
    {icon:'fa-poll',label:'发起投票',color:'orange',onClick:()=>{onNavigate('orgActivity');setOpen(false)}},
    {icon:'fa-calendar-check',label:'查看排班',color:'emerald',onClick:()=>{onNavigate('orgActivity');setOpen(false)}},
    {icon:'fa-external-link-alt',label:'JoySpace',color:'purple',onClick:()=>{window.open('https://joyspace.jd.com/teams/CL3hiuRUe9EOVQMXu9WCs/9XiLd7doHAaCSck0Lftc','_blank');setOpen(false)}},
  ];
  const colorMap={blue:'bg-blue-500 hover:bg-blue-600',orange:'bg-orange-500 hover:bg-orange-600',emerald:'bg-emerald-500 hover:bg-emerald-600',purple:'bg-purple-500 hover:bg-purple-600'};

  return(<div ref={ref} className="fixed bottom-[28px] right-[28px] z-40">
    {open&&<div className="absolute bottom-[56px] right-0 flex flex-col gap-[8px] items-end">
      {actions.map((a,i)=>(<button key={i} onClick={a.onClick} className={`fab-item flex items-center gap-[8px] px-[14px] py-[8px] rounded-[12px] text-white shadow-lg hover:shadow-xl transition-all ${colorMap[a.color]}`}>
        <span className="text-[12px] font-medium whitespace-nowrap">{a.label}</span>
        <i className={`fas ${a.icon} text-[12px]`}></i>
      </button>))}
    </div>}
    <button onClick={()=>setOpen(!open)} className={`w-[48px] h-[48px] rounded-[14px] shadow-lg hover:shadow-xl flex items-center justify-center text-white text-[18px] transition-all duration-300 ${open?'bg-gray-700 dark:bg-gray-600 rotate-45':'bg-gradient-to-br from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700'}`}>
      <i className="fas fa-plus"></i>
    </button>
  </div>);
}

// ========== Page Transition Wrapper ==========
function PageTransition({page,children}){
  const[key,setKey]=useState(page);
  const[show,setShow]=useState(true);
  useEffect(()=>{
    if(page!==key){setShow(false);setTimeout(()=>{setKey(page);setShow(true)},150)}
  },[page]);
  return <div className={`transition-all duration-300 ${show?'opacity-100 translate-y-0':'opacity-0 translate-y-[8px]'}`}>{children}</div>;
}

      <div className="flex justify-between items-center mb-[20px]">
        <div className="flex items-center gap-[8px]"><div className="w-[32px] h-[32px] bg-purple-50 dark:bg-purple-900/30 rounded-[8px] flex items-center justify-center"><i className="fas fa-sparkles text-purple-600 dark:text-purple-400 text-[14px]"></i></div><h2 className="text-[18px] font-bold text-gray-900 dark:text-gray-100">前沿视界</h2></div>
        <div className="flex bg-gray-100 dark:bg-gray-800 p-[3px] rounded-[8px]">{[['news','行业动态'],['skills','开源趋势'],['practice','内部沉淀']].map(([k,l])=>(<button key={k} onClick={()=>setActiveTab(k)} className={`px-[14px] py-[6px] text-[12px] font-medium rounded-[6px] transition-all ${activeTab===k?'bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 shadow-sm':'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300'}`}>{l}</button>))}</div>
      </div>
      <div className="min-h-[300px]">
        {activeTab==='news'&&(<div className="flex flex-col gap-[12px]">
          <div className="p-[18px] bg-gradient-to-r from-blue-50/50 to-purple-50/30 dark:from-blue-900/20 dark:to-purple-900/10 rounded-[12px] border border-blue-100/30 dark:border-blue-800/30"><h3 className="text-[14px] font-semibold text-gray-800 dark:text-gray-200 mb-[4px]">🏦 金融支付 × AI 探索</h3><p className="text-[12px] text-gray-500 dark:text-gray-400 leading-relaxed">汇集最新支付行业与大模型结合的落地案例，探索智能客服、风控、投研等场景。</p></div>
          <div className="p-[18px] bg-gradient-to-r from-emerald-50/50 to-blue-50/30 dark:from-emerald-900/20 dark:to-blue-900/10 rounded-[12px] border border-emerald-100/30 dark:border-emerald-800/30">
            <div className="flex items-center justify-between mb-[4px]"><h3 className="text-[14px] font-semibold text-gray-800 dark:text-gray-200">📡 AI Builders' Insight</h3><a href="https://luolan0214.github.io/follow-builders-newsletter/" target="_blank" rel="noreferrer" className="text-[11px] bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 px-[8px] py-[3px] rounded-[5px] text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium">阅读原刊 ↗</a></div>
            <p className="text-[12px] text-gray-500 dark:text-gray-400 mb-[10px]">精选 Newsletter 内容，追踪硅谷与国内顶级团队最新突破。</p>
            <div className="flex flex-col gap-[6px] max-h-[240px] overflow-y-auto">{newsletter.map(n=>(<a key={n.id} href="https://luolan0214.github.io/follow-builders-newsletter/" target="_blank" rel="noreferrer" className="flex justify-between items-center p-[10px] bg-white dark:bg-gray-800 rounded-[8px] border border-gray-100 dark:border-gray-700 hover:shadow-sm transition-all group"><div className="flex-1 min-w-0"><div className="text-[13px] font-medium text-gray-800 dark:text-gray-200 group-hover:text-blue-600 dark:group-hover:text-blue-400 truncate">#{n.issue} {n.title}</div><div className="text-[11px] text-gray-400 dark:text-gray-500 truncate mt-[1px]">{n.summary}</div></div><span className="text-[10px] text-gray-400 dark:text-gray-500 ml-[10px] flex-shrink-0">{n.date}</span></a>))}</div>
          </div>
        </div>)}
        {activeTab==='skills'&&(<div className="flex flex-col gap-[8px]">
          <div className="text-[12px] text-gray-500 dark:text-gray-400 font-medium mb-[2px]">本周 GitHub 高赞项目</div>
          {skills.map((s,i)=>(<a key={s.id} href={s.url} target="_blank" rel="noreferrer" className="p-[14px] bg-gray-50 dark:bg-gray-800 rounded-[10px] hover:bg-white dark:hover:bg-gray-700 hover:shadow-md transition-all border border-transparent hover:border-gray-100 dark:hover:border-gray-600 group">
            <div className="flex justify-between items-center mb-[4px]"><span className="text-[14px] font-semibold text-gray-900 dark:text-gray-100 group-hover:text-blue-600 dark:group-hover:text-blue-400 flex items-center gap-[6px]"><span className="text-[11px] text-gray-400">{i<3?['🥇','🥈','🥉'][i]:(i+1)+'.'}</span>{s.author}/{s.name}</span><span className="text-[11px] font-medium text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/30 px-[6px] py-[1px] rounded-full flex items-center gap-[3px]"><i className="fas fa-star text-[9px]"></i>{s.stars}</span></div>
            <div className="text-[12px] text-gray-500 dark:text-gray-400">{s.desc}</div>{s.stw&&<div className="text-[10px] text-gray-400 dark:text-gray-500 mt-[2px]">📈 本周 +{s.stw}</div>}
          </a>))}
        </div>)}
        {activeTab==='practice'&&(<div className="p-[24px] bg-gray-50 dark:bg-gray-800 rounded-[12px] border border-dashed border-gray-200 dark:border-gray-700 text-center"><div className="w-[44px] h-[44px] bg-white dark:bg-gray-700 rounded-full flex items-center justify-center shadow-sm mx-auto mb-[12px]"><i className="fas fa-book text-gray-400 dark:text-gray-500 text-[18px]"></i></div><h3 className="text-[14px] font-semibold text-gray-800 dark:text-gray-200 mb-[4px]">内部沉淀与最佳实践</h3><p className="text-[12px] text-gray-500 dark:text-gray-400 mb-[14px] max-w-[360px] mx-auto">汇集部门内创新分享、架构演进与教程文档</p><a href="https://joyspace.jd.com/teams/CL3hiuRUe9EOVQMXu9WCs/9XiLd7doHAaCSck0Lftc" target="_blank" rel="noreferrer" className="inline-block px-[16px] py-[7px] bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-[8px] text-[12px] font-medium hover:bg-gray-50 dark:hover:bg-gray-600 shadow-sm">前往 JoySpace 查阅</a></div>)}
      </div>
    </div></div>
  </div>);
}

// ========== OrgActivityPage ==========
function OrgActivityPage(){
  const{getKey,updateKey,isAdmin}=useData();
  const schedules=getKey('schedules',[]);
  const polls=getKey('polls',[]);
  const[showPoll,setShowPoll]=useState(false);
  const[pollForm,setPollForm]=useState({title:'',desc:'',options:['','']});
  const[showImport,setShowImport]=useState(false);
  const[importText,setImportText]=useState('');
  const[importType,setImportType]=useState('周会');
  const[voterName,setVoterName]=useState(localStorage.getItem('gzt_voter')||'');

  const saveSch=s=>updateKey('schedules',s);
  const savePoll=p=>updateKey('polls',p);
  const weeklyMeeting=schedules.filter(s=>s.type==='周会');
  const familyDay=schedules.filter(s=>s.type==='家庭日');

  const handleImport=()=>{
    const lines=importText.trim().split('\n').filter(l=>l.trim());
    const items=lines.map(l=>{const p=l.split(/[,\t，]/).map(s=>s.trim());return{id:_id(),type:importType,week:p[0]||'',person:p[1]||'',role:p[2]||''}}).filter(i=>i.week&&i.person);
    if(!items.length)return;
    saveSch([...schedules.filter(s=>s.type!==importType),...items]);
    setShowImport(false);setImportText('');
  };

  const createPoll=()=>{
    const opts=pollForm.options.filter(o=>o.trim());
    if(!pollForm.title||opts.length<2)return;
    const newPoll={id:_id(),title:pollForm.title,desc:pollForm.desc,status:'active',options:opts.map(o=>({id:_id(),text:o,votes:[]})),created_at:new Date().toISOString()};
    savePoll([newPoll,...polls]);
    setShowPoll(false);setPollForm({title:'',desc:'',options:['','']});
  };

  const vote=(pollId,optId)=>{
    let name=voterName;
    if(!name){name=prompt('请输入你的姓名:');if(!name)return;setVoterName(name);localStorage.setItem('gzt_voter',name)}
    savePoll(polls.map(p=>{
      if(p.id!==pollId)return p;
      const newOpts=p.options.map(o=>({...o,votes:o.id===optId?[...new Set([...o.votes.filter(v=>v!==name),name])]:o.votes.filter(v=>v!==name)}));
      return{...p,options:newOpts};
    }));
  };

  const closePoll=id=>savePoll(polls.map(p=>p.id===id?{...p,status:'closed'}:p));
  const delPoll=id=>savePoll(polls.filter(p=>p.id!==id));

  return(<div className="flex-1 p-[32px]"><WelcomeHeader/>
    <div className="max-w-[1100px] flex flex-col gap-[20px]">
      {/* 排班 */}
      <div className="glass rounded-[18px] p-[24px] shadow-[0_4px_20px_rgba(0,0,0,0.03)] dark:shadow-[0_4px_20px_rgba(0,0,0,0.15)] relative overflow-hidden animate-fadeInUp">
        <div className="absolute top-0 left-0 right-0 h-[3px] bg-gradient-to-r from-blue-500 to-emerald-500"></div>
        <div className="flex items-center justify-between mb-[18px]">
          <div className="flex items-center gap-[8px]"><div className="w-[32px] h-[32px] bg-blue-50 dark:bg-blue-900/30 rounded-[8px] flex items-center justify-center"><i className="fas fa-calendar-alt text-blue-600 dark:text-blue-400 text-[14px]"></i></div><h2 className="text-[18px] font-bold text-gray-900 dark:text-gray-100">协作排班</h2></div>
          {isAdmin&&<button onClick={()=>setShowImport(true)} className="text-[12px] bg-gray-900 dark:bg-blue-600 text-white px-[12px] py-[5px] rounded-[8px] hover:bg-gray-800 dark:hover:bg-blue-700 font-medium"><i className="fas fa-file-import mr-[4px]"></i>导入排班表</button>}
        </div>
        <div className="grid grid-cols-2 gap-[16px]">
          <div className="bg-gradient-to-br from-blue-50/50 to-white dark:from-blue-900/20 dark:to-[#1e2026] rounded-[14px] p-[18px] border border-blue-100/30 dark:border-blue-800/30">
            <h3 className="text-[14px] font-semibold text-gray-800 dark:text-gray-200 mb-[10px] flex items-center gap-[6px]"><i className="fas fa-chalkboard-user text-blue-500 dark:text-blue-400 text-[12px]"></i>周会排班</h3>
            {weeklyMeeting.length>0?<div className="flex flex-col gap-[6px]">{weeklyMeeting.map(s=>(<div key={s.id} className="flex justify-between items-center p-[10px] bg-white dark:bg-gray-800 rounded-[8px] border border-gray-100 dark:border-gray-700"><span className="text-[13px] text-gray-700 dark:text-gray-300 font-medium">{s.week}</span><div className="flex items-center gap-[8px]"><span className="text-[12px] bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 px-[8px] py-[2px] rounded-[5px] font-medium">{s.person}</span>{s.role&&<span className="text-[11px] text-gray-400 dark:text-gray-500">{s.role}</span>}</div></div>))}</div>:<EmptySchedule type="周会"/>}
          </div>
          <div className="bg-gradient-to-br from-emerald-50/50 to-white dark:from-emerald-900/20 dark:to-[#1e2026] rounded-[14px] p-[18px] border border-emerald-100/30 dark:border-emerald-800/30">
            <h3 className="text-[14px] font-semibold text-gray-800 dark:text-gray-200 mb-[10px] flex items-center gap-[6px]"><i className="fas fa-house-chimney text-emerald-500 dark:text-emerald-400 text-[12px]"></i>家庭日排班</h3>
            {familyDay.length>0?<div className="flex flex-col gap-[6px]">{familyDay.map(s=>(<div key={s.id} className="flex justify-between items-center p-[10px] bg-white dark:bg-gray-800 rounded-[8px] border border-gray-100 dark:border-gray-700"><span className="text-[13px] text-gray-700 dark:text-gray-300 font-medium">{s.week}</span><span className="text-[12px] bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 px-[8px] py-[2px] rounded-[5px] font-medium">{s.person}</span></div>))}</div>:<EmptySchedule type="家庭日"/>}
          </div>
        </div>
      </div>

      {/* 团建投票 */}
      <div className="glass rounded-[18px] p-[24px] shadow-[0_4px_20px_rgba(0,0,0,0.03)] dark:shadow-[0_4px_20px_rgba(0,0,0,0.15)] relative overflow-hidden animate-fadeInUp stagger-1">
        <div className="absolute top-0 left-0 right-0 h-[3px] bg-gradient-to-r from-orange-500 to-pink-500"></div>
        <div className="flex items-center justify-between mb-[18px]">
          <div className="flex items-center gap-[8px]"><div className="w-[32px] h-[32px] bg-orange-50 dark:bg-orange-900/30 rounded-[8px] flex items-center justify-center"><i className="fas fa-mug-hot text-orange-600 dark:text-orange-400 text-[14px]"></i></div><h2 className="text-[18px] font-bold text-gray-900 dark:text-gray-100">团建与福利</h2></div>
          {isAdmin&&<button onClick={()=>setShowPoll(true)} className="text-[12px] bg-blue-600 text-white px-[12px] py-[5px] rounded-[8px] hover:bg-blue-700 font-medium"><i className="fas fa-poll mr-[4px]"></i>发起投票</button>}
        </div>
        <div className="p-[16px] bg-gradient-to-r from-orange-50/50 to-white dark:from-orange-900/20 dark:to-[#1e2026] rounded-[14px] border border-orange-100/30 dark:border-orange-800/30 mb-[14px]">
          <div className="flex justify-between items-center mb-[8px]"><span className="text-[13px] text-gray-700 dark:text-gray-300 font-medium">部门团建经费账本</span><a href="https://joyspace.jd.com/sheets/4fa3isX6fEKrdZL8IbOF" target="_blank" rel="noreferrer" className="text-[12px] text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 font-medium">查看明细 ↗</a></div>
          <button className="w-full flex justify-center items-center py-[8px] bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 text-[12px] font-medium roundednsition-colors border border-gray-100 dark:border-gray-700"><i className="fas fa-qrcode mr-[6px]"></i>迟到扫码缴费</button>
        </div>
        {polls.length>0?<div className="flex flex-col gap-[12px]">{polls.map(poll=>{
          const total=poll.options.reduce((s,o)=>s+o.votes.length,0);
          return(<div key={poll.id} className="p-[16px] bg-white dark:bg-gray-800 rounded-[12px] border border-gray-100 dark:border-gray-700">
            <div className="flex justify-between items-start mb-[10px]"><div><h4 className="text-[14px] font-semibold text-gray-800 dark:text-gray-200">{poll.title}</h4>{poll.desc&&<p className="text-[11px] text-gray-500 dark:text-gray-400 mt-[2px]">{poll.desc}</p>}</div>
              <div className="flex items-center gap-[6px]"><span className={`text-[10px] px-[6px] py-[1px] rounded-full font-medium ${poll.status==='active'?'bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400':'bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-400'}`}>{poll.status==='active'?'进行中':'已结束'}</span><span className="text-[10px] text-gray-400 dark:text-gray-500">{total} 票</span>
                {isAdmin&&poll.status==='active'&&<button onClick={()=>closePoll(poll.id)} className="text-[10px] text-gray-400 dark:text-gray-500 hover:text-red-500" title="关闭"><i className="fas fa-stop"></i></button>}
                {isAdmin&&<button onClick={()=>delPoll(poll.id)} className="text-[10px] text-gray-400 dark:text-gray-500 hover:text-red-500" title="删除"><i className="fas fa-trash"></i></button>}
              </div>
            </div>
            <div className="flex flex-col gap-[6px]">{poll.options.map(opt=>(<button key={opt.id} onClick={()=>poll.status==='active'&&vote(poll.id,opt.id)} disabled={poll.status!=='active'} className="flex items-center gap-[8px] p-[8px] rounded-[8px] border border-gray-100 dark:border-gray-700 hover:border-blue-200 dark:hover:border-blue-700 transition-all text-left w-full">
              <div className="flex-1"><div className="flex justify-between text-[12px] mb-[3px]"><span className="font-medium text-gray-700 dark:text-gray-300">{opt.text}</span><span className="text-gray-400 dark:text-gray-500">{opt.votes.length} 票{total>0?` (${Math.round(opt.votes.length/total*100)}%)`:''}</span></div><div className="h-[4px] bg-gray-100 dark:bg-gray-700 rounded-full overflow-hidden"><div className="h-full bg-blue-500 rounded-full transition-all duration-500" style={{width:total>0?(opt.votes.length/total*100)+'%':'0%'}}></div></div>
                {opt.votes.length>0&&<div className="mt-[3px] text-[10px] text-gray-400 dark:text-gray-500">{opt.votes.join('、')}</div>}
              </div>
            </button>))}</div>
          </div>)})}</div>:<EmptyPolls/>}
      </div>
    </div>

    <Modal open={showImport} onClose={()=>setShowImport(false)} title="导入排班表">
      <div className="flex flex-col gap-[12px]">
        <div><label className="text-[12px] text-gray-500 dark:text-gray-400 font-medium mb-[4px] block">排班类型</label><select value={importType} onChange={e=>setImportType(e.target.value)} className="w-full px-[12px] py-[8px] bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-[10px] text-[13px] text-gray-900 dark:text-gray-100"><option value="周会">周会排班</option><option value="家庭日">家庭日排班</option></select></div>
        <div><label className="text-[12px] text-gray-500 dark:text-gray-400 font-medium mb-[4px] block">粘贴排班数据</label><p className="text-[11px] text-gray-400 dark:text-gray-500 mb-[6px]">格式: 周次, 负责人, 角色（可选）</p><textarea value={importText} onChange={e=>setImportText(e.target.value)} rows={6} className="w-full px-[12px] py-[8px] bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-[10px] text-[13px] text-gray-900 dark:text-gray-100 focus:outline-none focus:border-blue-300" placeholder={"W24, 张三, 主持人\nW25, 李四, 主持人\nW26, 王五, 主持人"}/></div>
        <button onClick={handleImport} className="w-full py-[9px] bg-gray-900 dark:bg-blue-600 text-white rounded-[10px] text-[13px] font-medium hover:bg-gray-800 dark:hover:bg-blue-700">确认导入</button>
      </div>
    </Modal>

    <Modal open={showPoll} onClose={()=>setShowPoll(false)} title="发起团建投票">
      <div className="flex flex-col gap-[12px]">
        <div><label className="text-[12px] text-gray-500 dark:text-gray-400 font-medium mb-[4px] block">投票主题 *</label><input value={pollForm.title} onChange={e=>setPollForm({...pollForm,title:e.target.value})} className="w-full px-[12px] py-[8px] bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-[10px] text-[13px] text-gray-900 dark:text-gray-100 focus:outline-none focus:border-blue-300" placeholder="如: 本月团建去哪里？"/></div>
        <div><label className="text-[12px] text-gray-500 dark:text-gray-400 font-medium mb-[4px] block">描述</label><input value={pollForm.desc} onChange={e=>setPollForm({...pollForm,desc:e.target.value})} className="w-full px-[12px] py-[8px] bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-[10px] text-[13px] text-gray-900 dark:text-gray-100 focus:outline-none focus:border-blue-300" placeholder="补充说明..."/></div>
        <div><label className="text-[12px] text-gray-500 dark:text-gray-400 font-medium mb-[4px] block">选项 *（至少2个）</label>
          <div className="flex flex-col gap-[6px]">{pollForm.options.map((o,i)=>(<div key={i} className="flex gap-[6px]"><input value={o} onChange={e=>{const ops=[...pollForm.options];ops[i]=e.target.value;setPollForm({...pollForm,options:ops})}} className="flex-1 px-[12px] py-[8px] bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-[10px] text-[13px] text-gray-900 dark:text-gray-100 focus:outline-none focus:border-blue-300" placeholder={`选项 ${i+1}`}/>{pollForm.options.length>2&&<button onClick={()=>setPollForm({...pollForm,options:pollForm.options.filter((_,j)=>j!==i)})} className="text-gray-400 hover:text-red-500 px-[6px]"><i className="fas fa-minus"></i></button>}</div>))}
            <button onClick={()=>setPollForm({...pollForm,options:[...pollForm.options,'']})} className="text-[12px] text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-300 font-medium py-[4px]"><i className="fas fa-plus mr-[4px]"></i>添加选项</button>
          </div>
        </div>
        <button onClick={createPoll} className="mt-[4px] w-full py-[9px] bg-blue-600 text-white rounded-[10px] text-[13px] font-medium hover:bg-blue-700">发起投票</button>
      </div>
    </Modal>
  </div>);
}

// ========== Loading Screen ==========
function LoadingScreen(){
  return(<div className="w-full min-h-screen bg-[#f4f6f9] dark:bg-[#111318] flex items-center justify-center">
    <div className="text-center animate-fadeInUp">
      <div className="w-[48px] h-[48px] bg-gradient-to-br from-gray-800 to-gray-900 dark:from-blue-600 dark:to-indigo-700 rounded-[14px] flex items-center justify-center shadow-lg mx-auto mb-[16px]"><i className="fas fa-layer-group text-white text-[20px]"></i></div>
      <p className="text-[14px] text-gray-500 dark:text-gray-400 font-medium">加载共享数据中...</p>
    </div>
  </div>);
}

// ========== App ==========
function App(){
  const[page,setPage]=useState('index');
  return(<ThemeProvider><DataProvider>
    <AppInner page={page} setPage={setPage}/>
  </DataProvider></ThemeProvider>);
}

function AppInner({page,setPage}){
  const{loading}=useData();
  if(loading)return <LoadingScreen/>;
  return(<div className="w-full min-h-screen bg-[#f4f6f9] dark:bg-[#111318]"><div className="mx-auto max-w-[1440px] flex min-h-screen">
    <Sidebar currentPage={page} onNavigate={setPage}/>
    <div className="flex-1 min-h-screen overflow-y-auto">
      <PageTransition page={page}>
        {page==='index'&&<Overview/>}
        {page==='aiInfo'&&<AIInfoPage/>}
        {page==='orgActivity'&&<OrgActivityPage/>}
      </PageTransition>
    </div>
    <FAB onNavigate={setPage}/>
  </div></div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
