<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>应用产品部工作台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    *{font-family:'Inter',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .animate-fadeInUp{animation:fadeInUp .4s ease-out forwards}
    .stagger-1{animation-delay:.05s;opacity:0}.stagger-2{animation-delay:.1s;opacity:0}.stagger-3{animation-delay:.15s;opacity:0}.stagger-4{animation-delay:.2s;opacity:0}
    .glass{background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.6)}
    .metric-ring{transform:rotate(-90deg)}
    ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:3px}
    .modal-overlay{background:rgba(0,0,0,.3);backdrop-filter:blur(4px)}
  </style>
</head>
<body class="bg-[#f4f6f9]">
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useCallback}=React;

// ========== LocalStorage DB ==========
const store={
  get(key,def=[]){try{return JSON.parse(localStorage.getItem('gzt_'+key))||def}catch{return def}},
  set(key,val){localStorage.setItem('gzt_'+key,JSON.stringify(val))},
};
let _id=()=>Date.now()+Math.random().toString(36).slice(2,6);

// ========== Seed Data ==========
if(!localStorage.getItem('gzt_seeded')){
  store.set('todos',[
    {id:'t1',title:'填写各项比赛讯息',type:'待办',priority:'high',date:'2026-06-15',status:'pending'},
    {id:'t2',title:'集团组织：代码创新大赛',type:'比赛',priority:'medium',date:'2026-06-20',status:'pending'},
    {id:'t3',title:'集团组织：技术分享演讲比赛',type:'比赛',priority:'low',date:'2026-07-01',status:'pending'},
  ]);
  store.set('github_skills',[
    {id:'s1',name:'taste-skill',author:'Leonxlnx',stars:'41,288',stw:'8,077',desc:'Taste-Skill - gives your AI good taste. stops the AI from generating boring, generic slop',url:'https://github.com/Leonxlnx/taste-skill'},
    {id:'s2',name:'last30days-skill',author:'mvanhorn',stars:'39,569',stw:'11,732',desc:'AI agent skill that researches any topic across Reddit, X, YouTube, HN, Polymarket, and the web',url:'https://github.com/mvanhorn/last30days-skill'},
    {id:'s3',name:'open-notebook',author:'lfnovo',stars:'29,179',stw:'4,648',desc:'An Open Source implementation of Notebook LM with more flexibility and features',url:'https://github.com/lfnovo/open-notebook'},
    {id:'s4',name:'Agent-Reach',author:'Panniantong',stars:'26,290',stw:'5,021',desc:'Give your AI agent eyes to see the entire internet. Read & search Twitter, Reddit, YouTube, GitHub, Bilibili — one CLI, zero API fees.',url:'https://github.com/Panniantong/Agent-Reach'},
    {id:'s5',name:'headroom',author:'chopratejas',stars:'22,749',stw:'13,062',desc:'Compress tool outputs, logs, files, and RAG chunks before they reach the LLM. 60-95% fewer tokens, same answers.',url:'https://github.com/chopratejas/headroom'},
    {id:'s6',name:'pm-skills',author:'phuryn',stars:'15,984',stw:'2,056',desc:'PM Skills Marketplace: 100+ agentic skills, commands, and plugins — discovery to strategy, execution, launch, growth.',url:'https://github.com/phuryn/pm-skills'},
    {id:'s7',name:'cosmos',author:'NVIDIA',stars:'9,873',stw:'1,174',desc:'NVIDIA Cosmos - open platform of world models, datasets, and tools for Physical AI.',url:'https://github.com/NVIDIA/cosmos'},
    {id:'s8',name:'plugins',author:'openai',stars:'2,792',stw:'1,371',desc:'OpenAI Plugins',url:'https://github.com/openai/plugins'},
  ]);
  store.set('newsletter',[
    {id:'n1',title:'Fable 余震日报',summary:'Box AI eval 显示 Fable 全面碾压 Opus、Codex token 消耗异常激增、Cursor 两年 15→700 人',date:'2026-06-11',issue:24},
    {id:'n2',title:'苹果入局日报',summary:'苹果宣布全设备 AI 智能、OpenAI 发布 2026 路线图定义 AGI 级别、Claude Code 一周年',date:'2026-06-10',issue:23},
    {id:'n3',title:'Benchmark 3.0 日报',summary:'FrontierCode 发布揭示 SWEBench 一半结果为 slop、OpenAI 发布路线图、NotebookLM 扩展',date:'2026-06-09',issue:22},
    {id:'n4',title:'设计 Loop 日报',summary:'Steipete 13734 赞宣言「去设计 loop 来 prompt agent」、OpenAI 推 100 天 10 倍限额',date:'2026-06-08',issue:21},
    {id:'n5',title:'Model Routing 周末版',summary:'Levie 长文论 token 经济与 model routing、企业三阶段路由演进',date:'2026-06-07',issue:20},
    {id:'n6',title:'Cowork 翻倍日报',summary:'Anthropic 翻倍 Cowork 限额、Vercel 发布 Skills API、AI skill 5 步构建法',date:'2026-06-06',issue:19},
    {id:'n7',title:'代码自主化日报',summary:'Anthropic 80% 代码由 Claude 写、ChatGPT 可直接发布 web app',date:'2026-06-05',issue:18},
    {id:'n8',title:'超杠杆通才日报',summary:'Nadella 谈全栈 Builder 崛起、Codex 因可靠性问题重置限额',date:'2026-06-04',issue:17},
    {id:'n9',title:'Yes-Code 日报',summary:'Claude Code Workflows 发布、no-code 被宣告终结',date:'2026-06-03',issue:16},
    {id:'n10',title:'多云竞争日报',summary:'OpenAI 入驻 AWS、MiniMax M3 成开源模型新标杆',date:'2026-06-02',issue:15},
  ]);
  store.set('metrics',[]);
  store.set('schedules',[]);
  store.set('polls',[]);
  localStorage.setItem('gzt_seeded','1');
}

// ========== Modal ==========
function Modal({open,onClose,title,children}){
  if(!open)return null;
  return(<div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay" onClick={onClose}>
    <div className="bg-white rounded-[20px] shadow-2xl w-[500px] max-h-[80vh] overflow-y-auto p-[28px] animate-fadeInUp" onClick={e=>e.stopPropagation()}>
      <div className="flex justify-between items-center mb-[20px]">
        <h3 className="text-[18px] font-bold text-gray-900">{title}</h3>
        <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><i className="fas fa-times"></i></button>
      </div>{children}
    </div></div>);
}

// ========== Sidebar ==========
function Sidebar({currentPage,onNavigate}){
  const[collapsed,setCollapsed]=useState(false);
  const navGroups={'核心看板':[{key:'index',icon:'fa-home',label:'数据概览'}],'资讯与协作':[{key:'aiInfo',icon:'fa-sparkles',label:'前沿视界'},{key:'orgActivity',icon:'fa-users',label:'组织事务'}]};
  return(
    <div className={`${collapsed?'w-[72px]':'w-[250px]'} bg-white min-h-screen flex flex-col border-r border-gray-100 shadow-[2px_0_8px_rgba(0,0,0,0.02)] transition-all duration-300 relative z-10`}>
      <div className={`p-[20px] ${collapsed?'px-[14px]':''} flex items-center gap-[10px] mb-[8px]`}>
        <div className="w-[34px] h-[34px] bg-gradient-to-br from-gray-800 to-gray-900 rounded-[10px] flex items-center justify-center shadow flex-shrink-0"><i className="fas fa-layer-group text-white text-[13px]"></i></div>
        {!collapsed&&<span className="font-bold text-[16px] text-gray-900 tracking-tight whitespace-nowrap">应用产品部工作台</span>}
      </div>
      <div className="flex-1 px-[10px] flex flex-col gap-[2px]">
        {Object.entries(navGroups).map(([g,items],gi)=>(
          <div key={g} className={gi>0?'mt-[12px]':''}>
            {!collapsed&&<div className="text-[11px] font-semibold text-gray-400 uppercase tracking-wider px-[10px] mb-[6px]">{g}</div>}
            {items.map(item=>(
              <button key={item.key} onClick={()=>onNavigate(item.key)}
                className={`w-full flex items-center gap-[10px] text-left px-[12px] py-[10px] rounded-[10px] text-[13px] font-medium transition-all duration-200 mb-[1px] ${currentPage===item.key?'bg-gradient-to-r from-gray-900 to-gray-800 text-white shadow-md':'text-gray-600 hover:bg-gray-50 hover:text-gray-900'}`}>
                <i className={`fas ${item.icon} w-[16px] text-center text-[12px] ${currentPage===item.key?'text-white':'text-gray-400'}`}></i>
                {!collapsed&&item.label}
              </button>
            ))}
          </div>
        ))}
      </div>
      <button onClick={()=>setCollapsed(!collapsed)} className="absolute top-[50%] -right-[12px] w-[22px] h-[22px] bg-white border border-gray-200 rounded-full flex items-center justify-center shadow-sm hover:shadow text-gray-400 hover:text-gray-600 text-[9px]">
        <i className={`fas ${collapsed?'fa-chevron-right':'fa-chevron-left'}`}></i>
      </button>
      <div className={`p-[14px] ${collapsed?'px-[10px]':'px-[16px]'} border-t border-gray-100`}>
        <div className="flex items-center gap-[8px]">
          <div className="w-[30px] h-[30px] rounded-full bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center text-white text-[11px] font-bold flex-shrink-0">我</div>
          {!collapsed&&<div className="text-[12px] font-medium text-gray-700 truncate">应用产品部</div>}
        </div>
      </div>
    </div>);
}

// ========== WelcomeHeader ==========
function WelcomeHeader(){
  const[time,setTime]=useState(new Date());
  useEffect(()=>{const t=setInterval(()=>setTime(new Date()),60000);return()=>clearInterval(t)},[]);
  const h=time.getHours();
  const g=h<9?'早上好':h<12?'上午好':h<14?'中午好':h<18?'下午好':'晚上好';
  const d=time.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  return(<div className="flex justify-between items-center mb-[24px] animate-fadeInUp"><div><h1 className="text-[24px] font-bold text-gray-900 tracking-tight">{g}，欢迎回来 👋</h1><p className="text-[13px] text-gray-500 mt-[2px]">{d}</p></div></div>);
}

// ========== MetricRing ==========
function MetricRing({percent,color,size=44}){
  const r=(size-6)/2,c=2*Math.PI*r;
  return(<svg width={size} height={size} className="metric-ring"><circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#f3f4f6" strokeWidth="5"/><circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="5" strokeDasharray={c} strokeDashoffset={c-(percent/100)*c} strokeLinecap="round" style={{transition:'stroke-dashoffset 1s ease-out'}}/></svg>);
}

// ========== QuarterGoals ==========
function QuarterGoals(){
  const[metrics,setMetrics]=useState(store.get('metrics',[]));
  const[showAdd,setShowAdd]=useState(false);
  const[form,setForm]=useState({label:'',value:'',change_text:'',positive:1,percent:0,color:'#3b82f6',icon:'fa-chart-line',link:''});
  const[editId,setEditId]=useState(null);
  const save=m=>{store.set('metrics',m);setMetrics(m)};

  const handleSave=()=>{
    if(!form.label||!form.value)return;
    if(editId){save(metrics.map(m=>m.id===editId?{...m,...form}:m))}
    else{save([...metrics,{id:_id(),...form}])}
    setShowAdd(false);setEditId(null);setForm({label:'',value:'',change_text:'',positive:1,percent:0,color:'#3b82f6',icon:'fa-chart-line',link:''});
  };
  const handleEdit=m=>{setForm({label:m.label,value:m.value,change_text:m.change_text,positive:m.positive,percent:m.percent,color:m.color,icon:m.icon,link:m.link||''});setEditId(m.id);setShowAdd(true)};
  const handleDel=id=>save(metrics.filter(m=>m.id!==id));
  const colorOpts=[{v:'#3b82f6',l:'蓝'},{v:'#10b981',l:'绿'},{v:'#8b5cf6',l:'紫'},{v:'#f59e0b',l:'橙'},{v:'#ef4444',l:'红'},{v:'#06b6d4',l:'青'}];

  return(<div className="animate-fadeInUp stagger-1">
    <div className="flex justify-between items-end mb-[14px] px-[4px]">
      <div><h2 className="text-[17px] font-bold text-gray-900">季度核心目标</h2><div className="text-[12px] text-gray-500 mt-[2px]">监控关键业务指标与系统状态</div></div>
      <div className="flex items-center gap-[10px]">
        <a href="https://joyspace.jd.com/sheets/hzlz9t5uEmXdzLKSUyHn" target="_blank" rel="noreferrer" className="text-[12px] text-blue-600 hover:text-blue-700 flex items-center gap-[4px] font-medium">查看战略图景 <i className="fas fa-arrow-right text-[10px]"></i></a>
        <button onClick={()=>{setEditId(null);setForm({label:'',value:'',change_text:'',positive:1,percent:0,color:'#3b82f6',icon:'fa-chart-line',link:''});setShowAdd(true)}} className="text-[12px] bg-gray-900 text-white px-[12px] py-[5px] rounded-[8px] hover:bg-gray-800 font-medium"><i className="fas fa-plus mr-[4px]"></i>新增指标</button>
      </div>
    </div>
    {metrics.length===0?(<div className="bg-white rounded-[16px] p-[40px] border border-dashed border-gray-200 text-center"><i className="fas fa-chart-pie text-[32px] text-gray-300 mb-[12px]"></i><p className="text-[14px] text-gray-500">暂无核心指标，点击「新增指标」添加</p></div>):(
      <div className="grid gap-[14px]" style={{gridTemplateColumns:`repeat(${Math.min(metrics.length,4)},1fr)`}}>
        {metrics.map(m=>(<div key={m.id} onClick={()=>m.link&&window.open(m.link,'_blank')} className={`group bg-white rounded-[16px] p-[20px] border border-gray-100 shadow-[0_2px_10px_rgba(0,0,0,0.03)] hover:shadow-lg hover:-translate-y-0.5 transition-all duration-300 relative overflow-hidden ${m.link?'cursor-pointer':''}`}>
          <div className="absolute top-0 left-0 right-0 h-[3px] rounded-t-[16px]" style={{background:`linear-gradient(90deg,${m.color},${m.color}88)`}}></div>
          <div className="absolute top-[8px] right-[8px] opacity-0 group-hover:opacity-100 flex gap-[4px] transition-opacity">
            <button onClick={e=>{e.stopPropagation();handleEdit(m)}} className="w-[24px] h-[24px] rounded-[6px] bg-gray-100 flex items-center justify-center text-gray-500 hover:text-blue-600 text-[10px]"><i className="fas fa-pen"></i></button>
            <button onClick={e=>{e.stopPropagation();handleDel(m.id)}} className="w-[24px] h-[24px] rounded-[6px] bg-gray-100 flex items-center justify-center text-gray-500 hover:text-red-600 text-[10px]"><i className="fas fa-trash"></i></button>
          </div>
          <div className="flex items-start justify-between"><div className="flex-1">
            <div className="text-[11px] text-gray-500 font-medium mb-[8px] flex items-center gap-[5px]"><i className={`fas ${m.icon} text-[9px]`} style={{color:m.color}}></i>{m.label}</div>
            <div className="text-[26px] font-bold text-gray-900 tracking-tight leading-none">{m.value}</div>
            {m.change_text&&<div className={`mt-[6px] text-[11px] font-medium inline-flex items-center gap-[3px] px-[6px] py-[1px] rounded-full ${m.positive===1?'text-emerald-600 bg-emerald-50':m.positive===0?'text-red-600 bg-red-50':'text-gray-500 bg-gray-100'}`}>{m.positive===1&&<i className="fas fa-arrow-up text-[8px]"></i>}{m.positive===0&&<i className="fas fa-arrow-down text-[8px]"></i>}{m.change_text}</div>}
          </div><div className="opacity-60 group-hover:opacity-100 transition-opacity"><MetricRing percent={m.percent} color={m.color}/></div></div>
        </div>))}
      </div>
    )}
    <Modal open={showAdd} onClose={()=>setShowAdd(false)} title={editId?'编辑指标':'新增指标'}>
      <div className="flex flex-col gap-[14px]">
        <div><label className="text-[12px] text-gray-500 font-medium mb-[4px] block">指标名称 *</label><input value={form.label} onChange={e=>setForm({...form,label:e.target.value})} className="w-full px-[12px] py-[9px] bg-gray-50 border border-gray-200 rounded-[10px] text-[13px] focus:outline-none focus:border-blue-300" placeholder="如: 活跃用户增长"/></div>
        <div className="grid grid-cols-2 gap-[10px]">
          <div><label className="text-[12px] text-gray-500 font-medium mb-[4px] block">数值 *</label><input value={form.value} onChange={e=>setForm({...form,value:e.target.value})} className="w-full px-[12px] py-[9px] bg-gray-50 border border-gray-200 rounded-[10px] text-[13px] focus:outline-none focus:border-blue-300" placeholder="如: 12,540"/></div>
          <div><label className="text-[12px] text-gray-500 font-medium mb-[4px] block">变化</label><input value={form.change_text} onChange={e=>setForm({...form,change_text:e.target.value})} className="w-full px-[12px] py-[9px] bg-gray-50 border border-gray-200 rounded-[10px] text-[13px] focus:outline-none focus:border-blue-300" placeholder="如: +10.2%"/></div>
        </div>
        <div className="grid grid-cols-3 gap-[10px]">
          <div><label className="text-[12px] text-gray-500 font-medium mb-[4px] block">趋势</label><select value={form.positive} onChange={e=>setForm({...form,positive:Number(e.target.value)})} className="w-full px-[12px] py-[9px] bg-gray-50 border border-gray-200 rounded-[10px] text-[13px]"><option value={1}>上升 ↑</option><option value={0}>下降 ↓</option><option value={-1}>持平 —</option></select></div>
          <div><label className="text-[12px] text-gray-500 font-medium mb-[4px] block">完成度 %</label><input type="number" min="0" max="100" value={form.percent} onChange={e=>setForm({...form,percent:Number(e.target.value)})} className="w-full px-[12px] py-[9px] bg-gray-50 border border-gray-200 rounded-[10px] text-[13px] focus:outline-none focus:border-blue-300"/></div>
          <div><label className="text-[12px] text-gray-500 font-medium mb-[4px] block">颜色</label><div className="flex gap-[4px] mt-[6px]">{colorOpts.map(c=>(<button key={c.v} onClick={()=>setForm({...form,color:c.v})} className={`w-[24px] h-[24px] rounded-full border-2 transition-all ${form.color===c.v?'border-gray-900 scale-110':'border-transparent'}`} style={{background:c.v}}></button>))}</div></div>
        </div>
        <div><label className="text-[12px] text-gray-500 font-medium mb-[4px] block">跳转链接</label><input value={form.link} onChange={e=>setForm({...form,link:e.target.value})} className="w-full px-[12px] py-[9px] bg-gray-50 border border-gray-200 rounded-[10px] text-[13px] focus:outline-none focus:border-blue-300" placeholder="https://..."/></div>
        <button onClick={handleSave} className="mt-[4px] w-full py-[10px] bg-gray-900 text-white rounded-[10px] text-[14px] font-medium hover:bg-gray-800">{editId?'保存修改':'添加指标'}</button>
      </div>
    </Modal>
  </div>);
}

// ========== TodoList ==========
function TodoList(){
  const[todos,setTodos]=useState(store.get('todos',[]));
  const[newTodo,setNewTodo]=useState('');
  const save=t=>{store.set('todos',t);setTodos(t)};
  const add=()=>{if(!newTodo.trim())return;save([{id:_id(),title:newTodo,type:'待办',priority:'medium',date:'',status:'pending'},...todos]);setNewTodo('')};
  const toggle=id=>save(todos.map(t=>t.id===id?{...t,status:t.status==='done'?'pending':'done'}:t));
  const del=id=>save(todos.filter(t=>t.id!==id));
  const pc={high:'border-l-red-400',medium:'border-l-amber-400',low:'border-l-blue-300'};
  const pending=todos.filter(t=>t.status!=='done'),done=todos.filter(t=>t.status==='done');
  return(<div className="glass rounded-[18px] p-[24px] shadow-[0_4px_20px_rgba(0,0,0,0.03)] h-full flex flex-col animate-fadeInUp stagger-2">
    <div className="flex justify-between items-center mb-[16px]"><div><h2 className="text-[17px] font-bold text-gray-900">待办与关注</h2><span className="text-[11px] text-gray-400">{pending.length} 项待处理</span></div><span className="text-[11px] text-gray-400 bg-gray-100 px-[8px] py-[2px] rounded-full">{done.length}/{todos.length} 完成</span></div>
    <div className="flex gap-[8px] mb-[12px]"><input value={newTodo} onChange={e=>setNewTodo(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()} placeholder="添加新待办..." className="flex-1 px-[12px] py-[8px] bg-gray-50 border border-gray-100 rounded-[10px] text-[13px] placeholder-gray-400 focus:outline-none focus:border-blue-300 focus:bg-white transition-all"/><button onClick={add} className="px-[12px] py-[8px] bg-gray-900 text-white rounded-[10px] text-[12px] font-medium hover:bg-gray-800"><i className="fas fa-plus"></i></button></div>
    <div className="flex flex-col gap-[6px] flex-1 overflow-y-auto">
      {todos.sort((a,b)=>a.status==='done'?1:b.status==='done'?-1:0).map(t=>(<div key={t.id} className={`flex items-center justify-between p-[12px] rounded-[10px] border-l-[3px] ${pc[t.priority]||'border-l-gray-300'} bg-gray-50/60 hover:bg-white hover:shadow-sm transition-all group ${t.status==='done'?'opacity-50':''}`}>
        <div className="flex items-center gap-[10px]">
          <button onClick={()=>toggle(t.id)} className={`w-[18px] h-[18px] rounded-full border-2 flex items-center justify-center transition-all flex-shrink-0 ${t.status==='done'?'bg-emerald-500 border-emerald-500':'border-gray-300 hover:border-blue-400'}`}>{t.status==='done'&&<i className="fas fa-check text-white text-[8px]"></i>}</button>
          <div><span className={`text-[13px] font-medium ${t.status==='done'?'text-gray-400 line-through':'text-gray-800'}`}>{t.title}</span>
            <div className="flex items-center gap-[6px] mt-[1px]"><span className={`text-[10px] font-medium px-[5px] py-[0.5px] rounded ${t.type==='待办'?'bg-orange-50 text-orange-500':'bg-emerald-50 text-emerald-500'}`}>{t.type}</span>{t.date&&<span className="text-[10px] text-gray-400">{t.date}</span>}</div>
          </div>
        </div>
        <button onClick={()=>del(t.id)} className="text-[11px] text-gray-300 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100"><i className="fas fa-trash"></i></button>
      </div>))}
    </div>
  </div>);
}

// ========== OrgActivityPage ==========
function OrgActivityPage(){
  const[schedules,setSchedules]=useState(store.get('schedules',[]));
  const[polls,setPolls]=useState(store.get('polls',[]));
  const[showPoll,setShowPoll]=useState(false);
  const[pollForm,setPollForm]=useState({title:'',desc:'',options:['','']});
  const[showImport,setShowImport]=useState(false);
  const[importText,setImportText]=useState('');
  const[importType,setImportType]=useState('周会');
  const[voterName,setVoterName]=useState(localStorage.getItem('gzt_voter')||'');

  const saveSch=s=>{store.set('schedules',s);setSchedules(s)};
  const savePoll=p=>{store.set('polls',p);setPolls(p)};
  const weeklyMeeting=schedules.filter(s=>s.type==='周会');
  const familyDay=schedules.filter(s=>s.type==='家庭日');

  const handleImport=()=>{
    const lines=importText.trim().split('\n').filter(l=>l.trim());
    const items=lines.map(l=>{const p=l.split(/[,\t，]/).map(s=>s.trim());return{id:_id(),type:importType,week:p[0]||'',person:p[1]||'',role:p[2]||''}}).filter(i=>i.week&&i.person);
    if(!items.length)return;
    saveSch([...schedules.filter(s=>s.type!==importType),...items]);
    setShowImport(false);setImportText('');
  };

  const createPoll=()=>{
    const opts=pollForm.options.filter(o=>o.trim());
    if(!pollForm.title||opts.length<2)return;
    const newPoll={id:_id(),title:pollForm.title,desc:pollForm.desc,status:'active',options:opts.map(o=>({id:_id(),text:o,votes:[]})),created_at:new Date().toISOString()};
    savePoll([newPoll,...polls]);
    setShowPoll(false);setPollForm({title:'',desc:'',options:['','']});
  };

  const vote=(pollId,optId)=>{
    let name=voterName;
    if(!name){name=prompt('请输入你的姓名:');if(!name)return;setVoterName(name);localStorage.setItem('gzt_voter',name)}
    savePoll(polls.map(p=>{
      if(p.id!==pollId)return p;
      const opts=p.options.map(o=>{
        let v=o.votes.filter(v=>v!==name);
        if(o.id===optId)v=[...v,name];
        return{...o,votes:v};
      });
      // Remove voter from other options
      const newOpts=opts.map(o=>({...o,votes:o.id===optId?[...new Set([...o.votes.filter(v=>v!==name),name])]:o.votes.filter(v=>v!==name)}));
      return{...p,options:newOpts};
    }));
  };

  const closePoll=id=>savePoll(polls.map(p=>p.id===id?{...p,status:'closed'}:p));
  const delPoll=id=>savePoll(polls.filter(p=>p.id!==id));

  return(<div className="flex-1 p-[32px]"><WelcomeHeader/>
    <div className="max-w-[1100px] flex flex-col gap-[20px]">
      {/* 排班 */}
      <div className="glass rounded-[18px] p-[24px] shadow-[0_4px_20px_rgba(0,0,0,0.03)] relative overflow-hidden animate-fadeInUp">
        <div className="absolute top-0 left-0 right-0 h-[3px] bg-gradient-to-r from-blue-500 to-emerald-500"></div>
        <div className="flex items-center justify-between mb-[18px]">
          <div className="flex items-center gap-[8px]"><div className="w-[32px] h-[32px] bg-blue-50 rounded-[8px] flex items-center justify-center"><i className="fas fa-calendar-alt text-blue-600 text-[14px]"></i></div><h2 className="text-[18px] font-bold text-gray-900">协作排班</h2></div>
          <button onClick={()=>setShowImport(true)} className="text-[12px] bg-gray-900 text-white px-[12px] py-[5px] rounded-[8px] hover:bg-gray-800 font-medium"><i className="fas fa-file-import mr-[4px]"></i>导入排班表</button>
        </div>
        <div className="grid grid-cols-2 gap-[16px]">
          <div className="bg-gradient-to-br from-blue-50/50 to-white rounded-[14px] p-[18px] border border-blue-100/30">
            <h3 className="text-[14px] font-semibold text-gray-800 mb-[10px] flex items-center gap-[6px]"><i className="fas fa-chalkboard-user text-blue-500 text-[12px]"></i>周会排班</h3>
            {weeklyMeeting.length>0?<div className="flex flex-col gap-[6px]">{weeklyMeeting.map(s=>(<div key={s.id} className="flex justify-between items-center p-[10px] bg-white rounded-[8px] border border-gray-100"><span className="text-[13px] text-gray-700 font-medium">{s.week}</span><div className="flex items-center gap-[8px]"><span className="text-[12px] bg-blue-50 text-blue-600 px-[8px] py-[2px] rounded-[5px] font-medium">{s.person}</span>{s.role&&<span className="text-[11px] text-gray-400">{s.role}</span>}</div></div>))}</div>:<p className="text-[12px] text-gray-400 text-center py-[12px]">暂无排班，请导入表格</p>}
          </div>
          <div className="bg-gradient-to-br from-emerald-50/50 to-white rounded-[14px] p-[18px] border border-emerald-100/30">
            <h3 className="text-[14px] font-semibold text-gray-800 mb-[10px] flex items-center gap-[6px]"><i className="fas fa-house-chimney text-emerald-500 text-[12px]"></i>家庭日排班</h3>
            {familyDay.length>0?<div className="flex flex-col gap-[6px]">{familyDay.map(s=>(<div key={s.id} className="flex justify-between items-center p-[10px] bg-white rounded-[8px] border border-gray-100"><span className="text-[13px] text-gray-700 font-medium">{s.week}</span><span className="text-[12px] bg-emerald-50 text-emerald-600 px-[8px] py-[2px] rounded-[5px] font-medium">{s.person}</span></div>))}</div>:<p className="text-[12px] text-gray-400 text-center py-[12px]">暂无排班，请导入表格</p>}
          </div>
        </div>
      </div>

      {/* 团建投票 */}
      <div className="glass rounded-[18px] p-[24px] shadow-[0_4px_20px_rgba(0,0,0,0.03)] relative overflow-hidden animate-fadeInUp stagger-1">
        <div className="absolute top-0 left-0 right-0 h-[3px] bg-gradient-to-r from-orange-500 to-pink-500"></div>
        <div className="flex items-center justify-between mb-[18px]">
          <div className="flex items-center gap-[8px]"><div className="w-[32px] h-[32px] bg-orange-50 rounded-[8px] flex items-center justify-center"><i className="fas fa-mug-hot text-orange-600 text-[14px]"></i></div><h2 className="text-[18px] font-bold text-gray-900">团建与福利</h2></div>
          <button onClick={()=>setShowPoll(true)} className="text-[12px] bg-blue-600 text-white px-[12px] py-[5px] rounded-[8px] hover:bg-blue-700 font-medium"><i className="fas fa-poll mr-[4px]"></i>发起投票</button>
        </div>
        <div className="p-[16px] bg-gradient-to-r from-orange-50/50 to-white rounded-[14px] border border-orange-100/30 mb-[14px]">
          <div className="flex justify-between items-center mb-[8px]"><span className="text-[13px] text-gray-700 font-medium">部门团建经费账本</span><a href="https://joyspace.jd.com/sheets/4fa3isX6fEKrdZL8IbOF" target="_blank" rel="noreferrer" className="text-[12px] text-gray-500 hover:text-blue-600 font-medium">查看明细 ↗</a></div>
          <button className="w-full flex justify-center items-center py-[8px] bg-white hover:bg-gray-50 text-gray-700 text-[12px] font-medium rounded-[8px] transition-colors border border-gray-100"><i className="fas fa-qrcode mr-[6px]"></i>迟到扫码缴费</button>
        </div>
        {polls.length>0?<div className="flex flex-col gap-[12px]">{polls.map(poll=>{
          const total=poll.options.reduce((s,o)=>s+o.votes.length,0);
          return(<div key={poll.id} className="p-[16px] bg-white rounded-[12px] border border-gray-100">
            <div className="flex justify-between items-start mb-[10px]"><div><h4 className="text-[14px] font-semibold text-gray-800">{poll.title}</h4>{poll.desc&&<p className="text-[11px] text-gray-500 mt-[2px]">{poll.desc}</p>}</div>
              <div className="flex items-center gap-[6px]"><span className={`text-[10px] px-[6px] py-[1px] rounded-full font-medium ${poll.status==='active'?'bg-emerald-50 text-emerald-600':'bg-gray-100 text-gray-500'}`}>{poll.status==='active'?'进行中':'已结束'}</span><span className="text-[10px] text-gray-400">{total} 票</span>
                {poll.status==='active'&&<button onClick={()=>closePoll(poll.id)} className="text-[10px] text-gray-400 hover:text-red-500" title="关闭"><i className="fas fa-stop"></i></button>}
                <button onClick={()=>delPoll(poll.id)} className="text-[10px] text-gray-400 hover:text-red-500" title="删除"><i className="fas fa-trash"></i></button>
              </div>
            </div>
            <div className="flex flex-col gap-[6px]">{poll.options.map(opt=>(<button key={opt.id} onClick={()=>poll.status==='active'&&vote(poll.id,opt.id)} disabled={poll.status!=='active'} className="flex items-center gap-[8px] p-[8px] rounded-[8px] border border-gray-100 hover:border-blue-200 transition-all text-left w-full">
              <div className="flex-1"><div className="flex justify-between text-[12px] mb-[3px]"><span className="font-medium text-gray-700">{opt.text}</span><span className="text-gray-400">{opt.votes.length} 票{total>0?` (${Math.round(opt.votes.length/total*100)}%)`:''}</span></div><div className="h-[4px] bg-gray-100 rounded-full overflow-hidden"><div className="h-full bg-blue-500 rounded-full transition-all duration-500" style={{width:total>0?(opt.votes.length/total*100)+'%':'0%'}}></div></div></div>
            </button>))}</div>
          </div>)})}</div>:<div className="text-[12px] text-gray-400 text-center py-[16px]">暂无进行中的投票</div>}
      </div>
    </div>

    <Modal open={showImport} onClose={()=>setShowImport(false)} title="导入排班表">
      <div className="flex flex-col gap-[12px]">
        <div><label className="text-[12px] text-gray-500 font-medium mb-[4px] block">排班类型</label><select value={importType} onChange={e=>setImportType(e.target.value)} className="w-full px-[12px] py-[8px] bg-gray-50 border border-gray-200 rounded-[10px] text-[13px]"><option value="周会">周会排班</option><option value="家庭日">家庭日排班</option></select></div>
        <div><label className="text-[12px] text-gray-500 font-medium mb-[4px] block">粘贴排班数据</label><p className="text-[11px] text-gray-400 mb-[6px]">格式: 周次, 负责人, 角色（可选）</p><textarea value={importText} onChange={e=>setImportText(e.target.value)} rows={6} className="w-full px-[12px] py-[8px] bg-gray-50 border border-gray-200 rounded-[10px] text-[13px] focus:outline-none focus:border-blue-300" placeholder={"W24, 张三, 主持人\nW25, 李四, 主持人\nW26, 王五, 主持人"}/></div>
        <button onClick={handleImport} className="w-full py-[9px] bg-gray-900 text-white rounded-[10px] text-[13px] font-medium hover:bg-gray-800">确认导入</button>
      </div>
    </Modal>

    <Modal open={showPoll} onClose={()=>setShowPoll(false)} title="发起团建投票">
      <div className="flex flex-col gap-[12px]">
        <div><label className="text-[12px] text-gray-500 font-medium mb-[4px] block">投票主题 *</label><input value={pollForm.title} onChange={e=>setPollForm({...pollForm,title:e.target.value})} className="w-full px-[12px] py-[8px] bg-gray-50 border border-gray-200 rounded-[10px] text-[13px] focus:outline-none focus:border-blue-300" placeholder="如: 本月团建去哪里？"/></div>
        <div><label className="text-[12px] text-gray-500 font-medium mb-[4px] block">描述</label><input value={pollForm.desc} onChange={e=>setPollForm({...pollForm,desc:e.target.value})} className="w-full px-[12px] py-[8px] bg-gray-50 border border-gray-200 rounded-[10px] text-[13px] focus:outline-none focus:border-blue-300" placeholder="补充说明..."/></div>
        <div><label className="text-[12px] text-gray-500 font-medium mb-[4px] block">选项 *（至少2个）</label>
          <div className="flex flex-col gap-[6px]">{pollForm.options.map((o,i)=>(<div key={i} className="flex gap-[6px]"><input value={o} onChange={e=>{const ops=[...pollForm.options];ops[i]=e.target.value;setPollForm({...pollForm,options:ops})}} className="flex-1 px-[12px] py-[8px] bg-gray-50 border border-gray-200 rounded-[10px] text-[13px] focus:outline-none focus:border-blue-300" placeholder={`选项 ${i+1}`}/>{pollForm.options.length>2&&<button onClick={()=>setPollForm({...pollForm,options:pollForm.options.filter((_,j)=>j!==i)})} className="text-gray-400 hover:text-red-500 px-[6px]"><i className="fas fa-minus"></i></button>}</div>))}
            <button onClick={()=>setPollForm({...pollForm,options:[...pollForm.options,'']})} className="text-[12px] text-blue-600 hover:text-blue-700 font-medium py-[4px]"><i className="fas fa-plus mr-[4px]"></i>添加选项</button>
          </div>
        </div>
        <button onClick={createPoll} className="mt-[4px] w-full py-[9px] bg-blue-600 text-white rounded-[10px] text-[13px] font-medium hover:bg-blue-700">发起投票</button>
      </div>
    </Modal>
  </div>);
}

// ========== App ==========
function App(){
  const[page,setPage]=useState('index');
  return(<div className="w-full min-h-screen bg-[#f4f6f9]"><div className="mx-auto max-w-[1440px] flex min-h-screen">
    <Sidebar currentPage={page} onNavigate={setPage}/>
    <div className="flex-1 min-h-screen overflow-y-auto">
      {page==='index'&&<Overview/>}
      {page==='aiInfo'&&<AIInfoPage/>}
      {page==='orgActivity'&&<OrgActivityPage/>}
    </div>
  </div></div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
